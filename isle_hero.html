<title>The Wealth Isle</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--gold:#d8b566}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#efe7dc;font-family:'Hanken Grotesk',system-ui,sans-serif}
#c{position:fixed;inset:0;display:block;touch-action:none}
#load{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:#0d1219 center/cover no-repeat;color:#fff}
#load.hide{opacity:0;pointer-events:none;transition:opacity .8s}
#load::before{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(6,10,16,.86),rgba(6,10,16,.05) 52%,rgba(6,10,16,.3))}
#load .ld{position:relative;text-align:center;padding-bottom:13vh}
#load .ld .t{font-family:Georgia,serif;font-weight:600;font-size:clamp(26px,5vw,46px);text-shadow:0 2px 24px rgba(0,0,0,.55)}
#load .ld .s{margin-top:9px;font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:rgba(255,255,255,.82)}
#load .ld .bar{margin:14px auto 0;width:140px;height:2px;border-radius:2px;background:rgba(255,255,255,.2);overflow:hidden}
#load .ld .bar i{display:block;height:100%;width:40%;background:var(--gold);border-radius:2px;animation:ld 1.1s ease-in-out infinite}
@keyframes ld{0%{margin-left:-40%}100%{margin-left:100%}}
.brand{position:fixed;top:16px;left:20px;z-index:6;pointer-events:none;color:#6a5a48}
.brand .k{font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:#c79a56;font-weight:700}
.brand h1{margin:4px 0 0;font-family:Georgia,serif;font-weight:600;font-size:clamp(19px,2.8vw,28px)}
.hint{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:6;color:#7a6b58;font-size:12px;background:rgba(255,255,255,.5);border:1px solid rgba(0,0,0,.06);padding:7px 13px;border-radius:999px;backdrop-filter:blur(6px)}
.stamp{position:fixed;bottom:5px;right:9px;z-index:6;color:#9a8f7a;font-size:9px;opacity:.6}
</style>
<canvas id="c"></canvas>
<div id="load" style="background-image:url('tex/hero.webp')"><div class="ld"><div class="t">The Wealth Isle</div><div class="s">shaping your garden</div><div class="bar"><i></i></div></div></div>
<div class="brand"><div class="k">AlphaPipeline · Wealth Garden</div><h1>The Wealth Isle</h1></div>
<div class="hint"><b>Drag</b> to orbit · <b>scroll</b> to zoom</div>
<div class="stamp">isle build 1</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/GammaCorrectionShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/FXAAShader.js"></script>
<script>
const T=THREE;const MOBILE=innerWidth<720;
const renderer=new T.WebGLRenderer({canvas:document.getElementById('c'),antialias:!MOBILE});
renderer.setPixelRatio(Math.min(MOBILE?1.5:2,devicePixelRatio||1));
renderer.outputEncoding=T.LinearEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
const scene=new T.Scene();scene.fog=new T.FogExp2(0xffe7cf,0.0013);
const camera=new T.PerspectiveCamera(46,innerWidth/innerHeight,0.1,3000);camera.position.set(58,34,58);
const controls=new T.OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=0.06;controls.autoRotate=true;controls.autoRotateSpeed=0.4;controls.minDistance=14;controls.maxDistance=180;controls.maxPolarAngle=Math.PI*0.54;
// warm pastel sky
const skyU={top:{value:new T.Color(0xaec4e6)},bot:{value:new T.Color(0xffe7cf)}};
scene.add(new T.Mesh(new T.SphereGeometry(1200,32,16),new T.ShaderMaterial({side:T.BackSide,uniforms:skyU,vertexShader:'varying vec3 p;void main(){p=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',fragmentShader:'varying vec3 p;uniform vec3 top;uniform vec3 bot;void main(){float h=normalize(p).y*.5+.5;gl_FragColor=vec4(mix(bot,top,clamp(h,0.,1.)),1.);}'})));
scene.add(new T.HemisphereLight(0xffe1c4,0x6b5747,0.7));
const sun=new T.DirectionalLight(0xffd8a0,2.6);sun.position.set(-46,42,30);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.near=1;sun.shadow.camera.far=260;sun.shadow.camera.left=-70;sun.shadow.camera.right=70;sun.shadow.camera.top=70;sun.shadow.camera.bottom=-70;sun.shadow.bias=-0.0004;scene.add(sun);
try{const pm=new T.PMREMGenerator(renderer);scene.environment=pm.fromScene(new T.Scene(),0.04).texture;}catch(e){}
// clouds
const cloudTex=new T.TextureLoader().load('tex/cloud.png');
for(let i=0;i<44;i++){const low=Math.random()<0.7;const s=new T.Sprite(new T.SpriteMaterial({map:cloudTex,transparent:true,depthWrite:false,opacity:low?0.97:0.82}));const a=Math.random()*6.28,r=48+Math.random()*120;const sc=(low?18:12)+Math.random()*(low?26:16);s.scale.set(sc,sc*0.6,1);s.position.set(Math.cos(a)*r,(low?-22-Math.random()*16:6+Math.random()*20),Math.sin(a)*r);s.userData={a,r,sp:.2+Math.random()*.4};scene.add(s);s.userData.ref=s;window._clouds=window._clouds||[];window._clouds.push(s);}
// load island
let island=null;
const draco=new T.DRACOLoader();draco.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/draco/');
const gltf=new T.GLTFLoader();gltf.setDRACOLoader(draco);
gltf.load('isle_hero.glb',(g)=>{
  island=g.scene;
  const box=new T.Box3().setFromObject(island);const sz=box.getSize(new T.Vector3());const ctr=box.getCenter(new T.Vector3());
  const target=40; const s=target/Math.max(sz.x,sz.z); island.scale.setScalar(s);
  const box2=new T.Box3().setFromObject(island);const c2=box2.getCenter(new T.Vector3());
  island.position.sub(c2); island.position.y-=box2.min.y*0+0; // center at origin
  island.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;if(o.material){o.material.roughness=0.9;o.material.metalness=0;}}});
  scene.add(island);
  const b3=new T.Box3().setFromObject(island);const cc=b3.getCenter(new T.Vector3());
  controls.target.set(cc.x,cc.y,cc.z);
  const ld=document.getElementById('load');ld.classList.add('hide');setTimeout(()=>ld.style.display='none',800);
},undefined,e=>{document.getElementById('load').querySelector('.s').textContent='could not load island';console.error(e);});
// post
const composer=new T.EffectComposer(renderer);composer.addPass(new T.RenderPass(scene,camera));
let bloom=null;if(!MOBILE){bloom=new T.UnrealBloomPass(new T.Vector2(innerWidth,innerHeight),0.12,0.6,0.9);composer.addPass(bloom);}
composer.addPass(new T.ShaderPass(T.GammaCorrectionShader));const fxaa=new T.ShaderPass(T.FXAAShader);composer.addPass(fxaa);
function size(){const w=innerWidth,h=innerHeight,pr=renderer.getPixelRatio();renderer.setSize(w,h);composer.setSize(w,h);if(bloom)bloom.setSize(w,h);if(fxaa.material)fxaa.material.uniforms.resolution.value.set(1/(w*pr),1/(h*pr));camera.aspect=w/h;camera.updateProjectionMatrix();}
addEventListener('resize',size);size();
const clock=new T.Clock();
function anim(){requestAnimationFrame(anim);const t=clock.elapsedTime,dt=clock.getDelta();controls.update();
 if(island)island.position.y=Math.sin(t*.5)*.4;
 (window._clouds||[]).forEach(c=>{c.userData.a+=c.userData.sp*dt*0.03;c.position.x=Math.cos(c.userData.a)*c.userData.r;c.position.z=Math.sin(c.userData.a)*c.userData.r;});
 composer.render();}
anim();
</script>

<style>
:root{--ink:#eef1e8;--dim:#9aa593;--gold:#d8b566;--panel:rgba(12,18,14,.74);--line:rgba(255,255,255,.10);--up:#2a78d6;--down:#eda100}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#0b1017;color:var(--ink);font-family:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
#c{position:fixed;inset:0;display:block;touch-action:none}
#load{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:#0d1219;color:var(--dim);font-size:13px}#load.hide{opacity:0;pointer-events:none;transition:opacity .6s}
.brand{position:fixed;top:16px;left:20px;z-index:6;pointer-events:none}

.seg button.on{background:var(--ink);color:var(--gold)}
.list{position:fixed;top:70px;right:14px;width:232px;max-height:78vh;overflow:auto;z-index:6;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:9px;backdrop-filter:blur(10px)}
.list h2{font-family:Georgia,serif;font-size:13px;margin:3px 6px 6px}
.gh{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);display:flex;gap:6px;align-items:center;padding:6px 5px 2px}.gh .sw{width:8px;height:8px;border-radius:2px}.gh b{margin-left:auto;color:var(--ink);font-family:ui-monospace,monospace}
.row{display:flex;justify-content:space-between;gap:8px;padding:3px 5px;border-radius:6px;font-size:11.5px;cursor:pointer}.row:hover,.row.on{background:rgba(255,255,255,.08)}.row .v{font-family:ui-monospace,monospace;color:var(--dim)}.row .d{font-size:9px;display:block}
#card{position:fixed;z-index:8;pointer-events:none;opacity:0;transition:.1s;background:var(--panel);border:1px solid var(--gold);border-radius:10px;padding:8px 11px;backdrop-filter:blur(10px);min-width:150px}#card.show{opacity:1}
#card .cn{font-family:Georgia,serif;font-weight:600;font-size:14px}#card .cf{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;margin-top:1px}#card .cg{display:flex;gap:14px;margin-top:5px}#card .cg .l{font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}#card .cg .cv{font-family:ui-monospace,monospace;font-weight:600;font-size:13px}
.hint{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:6;color:var(--dim);font-size:12px;background:var(--panel);border:1px solid var(--line);padding:7px 13px;border-radius:999px;backdrop-filter:blur(8px);text-align:center}.hint b{color:var(--ink)}
#exp{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(6,10,8,.7);backdrop-filter:blur(4px)}
#exp.show{display:flex}
#exp .box{background:#121a14;border:1px solid var(--gold);border-radius:14px;padding:18px;width:min(560px,92vw)}
#exp h3{margin:0 0 6px;font-family:Georgia,serif}#exp p{color:var(--dim);font-size:12px;margin:0 0 10px}
#exp textarea{width:100%;height:180px;background:#0b110d;color:var(--ink);border:1px solid var(--line);border-radius:8px;font-family:ui-monospace,monospace;font-size:11px;padding:8px}
#exp .r{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}#exp button{font:inherit;padding:8px 14px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
@media(max-width:720px){.list{display:none}}

<script>
const T=THREE;const MOBILE=innerWidth<720||('ontouchstart'in window&&innerWidth<900);
const FAM={stock:['Stocks','#3a9a3a'],bond:['Bonds','#1baf7a'],metal:['Metals','#eda100'],energy:['Energy','#eb6834'],crypto:['Crypto','#f0902a'],realestate:['Real estate','#8a63c9'],cash:['Cash','#2a78d6'],collectable:['Collectables','#e87ba4'],alts:['Alternatives','#e87ba4']};
const BETA={stock:1.1,bond:0.3,metal:0.7,energy:1.4,crypto:2.0,cash:0.04,realestate:0.9,collectable:0.4,alts:1.1};
const YIELDF={bond:[2,5],cash:[3,5],stock:[0,4],realestate:[4,6],energy:[0,2],metal:[0,0],crypto:[0,0],collectable:[0,0],alts:[0,5]};
const MK={rally:{b:2.6,s0:0x4a90d6,s1:0xeaf6ff,flow:2.4,wc:0x39a0e0,label:'Rally'},fair:{b:0.6,s0:0x3f7fc4,s1:0xeaf3fb,flow:1.3,wc:0x2f8fd4,label:'Fair'},flat:{b:0,s0:0x8fa7b8,s1:0xe7ecee,flow:0.7,wc:0x5f96b0,label:'Flat'},bear:{b:-1.7,s0:0x9a8f7a,s1:0xe8ddcb,flow:0.25,wc:0x9c7f4a,label:'Drought'},crash:{b:-3.6,s0:0x515a63,s1:0xa7b0b6,flow:0.9,wc:0x486074,label:'Flood'}};
const fmt=v=>v>=1000?'$'+(v/1000).toFixed(v%1000&&v<10000?1:0)+'k':'$'+Math.round(v);
const REDUCED=matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const UP=new T.Color(0x2a78d6),DOWN=new T.Color(0xeda100),AMBER=new T.Color(0xc9a94b);
function hh(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return((h>>>0)%1000)/1000;}
const canvas=document.getElementById('c');
const renderer=new T.WebGLRenderer({canvas,antialias:!MOBILE});renderer.setPixelRatio(Math.min(MOBILE?1.5:2,devicePixelRatio||1));
renderer.outputEncoding=T.LinearEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
const scene=new T.Scene();scene.fog=new T.FogExp2(0xd6e6f2,0.0011);
try{const pm=new T.PMREMGenerator(renderer);scene.environment=pm.fromScene(new T.RoomEnvironment(),0.04).texture;}catch(e){}
const camera=new T.PerspectiveCamera(46,innerWidth/innerHeight,0.1,3000);camera.position.set(64,34,64);
const controls=new T.OrbitControls(camera,canvas);controls.enableDamping=true;controls.dampingFactor=0.06;controls.autoRotate=!REDUCED;controls.autoRotateSpeed=0.45;controls.minDistance=14;controls.maxDistance=180;controls.maxPolarAngle=Math.PI*0.52;controls.target.set(0,2,0);
const skyU={top:{value:new T.Color(0x3f7fc4)},bot:{value:new T.Color(0xeaf3fb)}};
scene.add(new T.Mesh(new T.SphereGeometry(1200,32,16),new T.ShaderMaterial({side:T.BackSide,uniforms:skyU,vertexShader:'varying vec3 p;void main(){p=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',fragmentShader:'varying vec3 p;uniform vec3 top;uniform vec3 bot;void main(){float h=normalize(p).y*.5+.5;gl_FragColor=vec4(mix(bot,top,clamp(h,0.,1.)),1.);}'})));
const hemi=new T.HemisphereLight(0xbfd8ff,0x55704a,0.7);scene.add(hemi);
const sun=new T.DirectionalLight(0xfff2d6,2.7);sun.position.set(-40,58,26);sun.castShadow=true;sun.shadow.mapSize.set(MOBILE?1024:2048,MOBILE?1024:2048);sun.shadow.camera.near=1;sun.shadow.camera.far=260;sun.shadow.camera.left=-80;sun.shadow.camera.right=80;sun.shadow.camera.top=80;sun.shadow.camera.bottom=-80;sun.shadow.bias=-0.0004;scene.add(sun);
const cloudMat=new T.MeshStandardMaterial({color:0xffffff,roughness:1,transparent:true,opacity:.92});
const clouds=[];for(let i=0;i<(MOBILE?40:70);i++){const g=new T.Group();const n=2+((Math.random()*3)|0);for(let j=0;j<n;j++){const b=new T.Mesh(new T.SphereGeometry(3+Math.random()*3,8,6),cloudMat);b.position.set((Math.random()-.5)*10,(Math.random()-.5)*2,(Math.random()-.5)*6);b.scale.y=.6;g.add(b);}const a=Math.random()*6.28,r=34+Math.random()*110;g.position.set(Math.cos(a)*r,-26-Math.random()*10,Math.sin(a)*r);g.userData.sp=.3+Math.random()*.6;clouds.push(g);scene.add(g);}
const birds=[];const bm=new T.LineBasicMaterial({color:0x223038});for(let i=0;i<7;i++){const geo=new T.BufferGeometry().setFromPoints([new T.Vector3(-1,0,0),new T.Vector3(0,.4,0),new T.Vector3(1,0,0)]);const ln=new T.Line(geo,bm);ln.userData={a:Math.random()*6.28,r:40+Math.random()*50,h:22+Math.random()*18,sp:.15+Math.random()*.2,ph:Math.random()*6};ln.scale.setScalar(1.8+Math.random());birds.push(ln);scene.add(ln);}
const waterU={t:{value:0},flow:{value:1.3},cA:{value:new T.Color(0x2f8fd4)},cB:{value:new T.Color(0x9fe0f0)}};
function makeWater(){return new T.ShaderMaterial({transparent:true,uniforms:waterU,vertexShader:'varying vec3 wp;void main(){wp=(modelMatrix*vec4(position,1.)).xyz;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',fragmentShader:'uniform float t;uniform float flow;uniform vec3 cA;uniform vec3 cB;varying vec3 wp;void main(){float w=sin(wp.x*.5+t*flow)*.5+sin(wp.z*.7-t*flow*1.3)*.5;float f=smoothstep(-.2,1.,w);vec3 c=mix(cA,cB,f*.7);float sp=smoothstep(.85,1.,sin(wp.x*2.5+t*flow*3.)*sin(wp.z*2.7-t*flow*2.));c+=sp*.5;gl_FragColor=vec4(c,.9);}'});}
const fallU={t:{value:0},flow:{value:1.3}};
function makeFall(){return new T.ShaderMaterial({transparent:true,uniforms:fallU,vertexShader:'varying vec2 vu;void main(){vu=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',fragmentShader:'uniform float t;uniform float flow;varying vec2 vu;void main(){float s=fract(vu.y*3.-t*flow*1.5);float foam=smoothstep(.7,1.,s)+.4;vec3 c=mix(vec3(.45,.72,.9),vec3(1.),foam*.6);gl_FragColor=vec4(c,.8);}'});}

const holds=[];const sways=[];const coins=[];const mines=[];let islandRoot=null,topY=0;
const fruitMat=new T.MeshStandardMaterial({color:0xE0483A,roughness:.5,emissive:0x330a06,emissiveIntensity:.25});
function addFruit(o){const box=new T.Box3().setFromObject(o);const c=box.getCenter(new T.Vector3());const sz=box.getSize(new T.Vector3());const invS=1/(o.scale.x||1);for(let i=0;i<4;i++){const a=Math.random()*6.28,rr=sz.x*0.26*Math.sqrt(Math.random());const wp=new T.Vector3(c.x+Math.cos(a)*rr,box.min.y+sz.y*(0.58+Math.random()*0.28),c.z+Math.sin(a)*rr);const m=new T.Mesh(new T.SphereGeometry(0.5,10,10),fruitMat);m.position.copy(o.worldToLocal(wp.clone()));m.scale.setScalar(invS);o.add(m);}}
const loader=new T.GLTFLoader();
loader.load('island.glb',(gltf)=>{
  islandRoot=gltf.scene;scene.add(islandRoot);
  const box=new T.Box3().setFromObject(islandRoot);const ctr=box.getCenter(new T.Vector3());const size=box.getSize(new T.Vector3());
  controls.target.set(ctr.x,ctr.y+size.y*0.13,ctr.z);
  islandRoot.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;if(o.material)o.material.side=T.FrontSide;}
    if(/IslandTop/i.test(o.name)){topY=new T.Box3().setFromObject(o).max.y;}
    if(/water/i.test(o.name)&&o.isMesh){o.material=makeWater();return;}
    if(o.isMesh&&o.material&&/Falls/i.test(o.material.name||'')){o.material=makeFall();}});
  islandRoot.traverse(o=>{if(o.userData&&o.userData.wg_name)holds.push(o);});
  // parent metal ore spheres to nearest metal rock so they follow drags
  const ores=[];islandRoot.traverse(o=>{if(o.isMesh&&o.material&&/Ore/i.test(o.material.name||''))ores.push(o);});
  const metals=holds.filter(h=>h.userData.wg_fam==='metal');
  ores.forEach(ore=>{let best=null,bd=1e9;const op=new T.Vector3();ore.getWorldPosition(op);metals.forEach(m=>{const mp=new T.Vector3();m.getWorldPosition(mp);const d=mp.distanceToSquared(op);if(d<bd){bd=d;best=m;}});if(best){const wp=ore.getWorldPosition(new T.Vector3());best.add(ore);ore.position.copy(best.worldToLocal(wp));}});
  holds.forEach(o=>{const fam=o.userData.wg_fam||'alts';o.userData.beta=BETA[fam]||1;const yr=YIELDF[fam]||[0,0];o.userData.yield=+(yr[0]+hh(o.userData.wg_name)*(yr[1]-yr[0])).toFixed(1);o.userData.seed=hh(o.userData.wg_name+'x');
    o.userData._mats=[];o.userData._fol=[];o.traverse(k=>{if(k.isMesh&&k.material&&k.material.color){k.material=k.material.clone();o.userData._mats.push(k.material);const c=k.material.color;if(c.g>c.r*1.03&&c.g>c.b*1.03)o.userData._fol.push({m:k.material,o:c.clone()});}});
    const nm=o.name||'';const isTree=/Tree/i.test(nm)||fam==='stock';const isBush=/Bush/i.test(nm)||fam==='bond';const isCoin=/Coin/i.test(nm)||fam==='crypto'||fam==='cash';const isBuild=/building|skyscraper|Windmill|fountain/i.test(nm)||fam==='realestate';const isMine=/Resource_Rock/i.test(nm)||fam==='metal';
    if(isTree||isBush)sways.push({o,base:o.rotation.z,amp:(isBush?0.03:0.06),ph:Math.random()*6.28,flex:isBush?0.5:1,beta:o.userData.beta});else if(isBuild)sways.push({o,base:o.rotation.z,amp:0.01,ph:Math.random()*6,flex:0.4,beta:0.5});
    if(isCoin)coins.push({o,beta:o.userData.beta});if(isMine)mines.push(o);
    if(fam==='stock')addFruit(o);});
  applyLayout();buildList();setMarket('fair');
  const ld=document.getElementById('load');ld.classList.add('hide');setTimeout(()=>ld.style.display='none',700);
},undefined,(err)=>{document.getElementById('load').textContent='Could not load the isle.';console.error(err);});

// layout persistence: fetch baked layout.json (default) then localStorage override; else de-grid jitter
function applyLayout(){let base=null;try{base=window.__BAKED||null;}catch(e){}
  let saved=null;try{saved=JSON.parse(localStorage.getItem('wg_layout2')||'null');}catch(e){}
  const L=saved||base;
  if(L){holds.forEach(o=>{const p=L[o.userData.wg_name];if(p){o.position.set(p[0],p[1],p[2]);if(p[3]!=null)o.rotation.y=p[3];}});}
  else{holds.forEach(o=>{if(o.userData.wg_fam==='crypto')return;o.position.x+=(hh(o.userData.wg_name+'jx')-.5)*2.4;o.position.z+=(hh(o.userData.wg_name+'jz')-.5)*2.4;if(ROTOK[o.userData.wg_fam])o.rotation.y=hh(o.userData.wg_name+'jr')*6.28;});}
}
fetch('layout.json').then(r=>r.ok?r.json():null).then(j=>{if(j){window.__BAKED=j;if(holds.length)applyLayout();}}).catch(()=>{});

// drips
const DN=90,dpos=new Float32Array(DN*3),dstate=[];for(let i=0;i<DN;i++){dpos[i*3+1]=-999;dstate.push({life:0});}
const dg=new T.BufferGeometry();dg.setAttribute('position',new T.Float32BufferAttribute(dpos,3));const drips=new T.Points(dg,new T.PointsMaterial({color:0xf3c65a,size:.5,transparent:true,opacity:.9,depthWrite:false}));scene.add(drips);let dcur=0;
function emitDrip(){if(!mines.length)return;const m=mines[(Math.random()*mines.length)|0];const p=new T.Vector3();m.getWorldPosition(p);const b=new T.Box3().setFromObject(m);const i=dcur++%DN;dstate[i]={life:1.4,vy:0,x:p.x+(Math.random()-.5)*1.2,y:b.max.y,z:p.z+(Math.random()-.5)*1.2};}

const lb=document.getElementById('lb');
function buildList(){lb.innerHTML='';const byF={};let nw=0;holds.forEach(o=>{const f=o.userData.wg_fam||'alts';(byF[f]=byF[f]||[]).push(o);nw+=(+o.userData.wg_val||0);});
 document.getElementById('nw').textContent=fmt(nw);document.getElementById('hc').textContent=holds.length;
 Object.keys(FAM).forEach(f=>{const its=(byF[f]||[]).sort((a,b)=>(+b.userData.wg_val)-(+a.userData.wg_val));if(!its.length)return;const sum=its.reduce((s,o)=>s+(+o.userData.wg_val||0),0);
  const g=document.createElement('div');g.innerHTML='<div class="gh"><span class="sw" style="background:'+FAM[f][1]+'"></span>'+FAM[f][0]+'<b>'+fmt(sum)+'</b></div>';
  its.forEach(o=>{const d=o.userData.day||0;const r=document.createElement('div');r.className='row';r.innerHTML='<span>'+o.userData.wg_name+'</span><span class="v">'+fmt(+o.userData.wg_val)+'<span class="d '+(d>=0?'up':'down')+'">'+(d>=0?'+':'')+d.toFixed(1)+'%</span></span>';
   r.onmouseenter=()=>{hoverObj=o;};r.onmouseleave=()=>{hoverObj=null;hideCard();};r.onclick=()=>{if(editMode)selectOnly(o);else focusOn(o);};g.appendChild(r);});
  lb.appendChild(g);});}

let curM='fair';
function setMarket(m){curM=m;const k=MK[m];holds.forEach(o=>{const j=(o.userData.seed-.5)*1.6;let d=k.b*o.userData.beta+j;const f=o.userData.wg_fam;if(f==='cash')d=k.b*.03+(o.userData.seed-.5)*.2;if(f==='bond')d=k.b*.3+(o.userData.seed-.5)*.5-(m==='rally'?.3:0);o.userData.day=d;
   const sign=d>=0?1:-1,mag=Math.min(1,Math.abs(d)/4),col=d>=0?UP:DOWN;o.userData._mats.forEach(mm=>{if(mm.emissive){mm.emissive.copy(col);mm.emissiveIntensity=.04+mag*.33;}});o.userData._fol.forEach(fl=>fl.m.color.copy(fl.o).lerp(AMBER,d<0?mag*.6:0));});
 waterU.flow.value=k.flow;waterU.cA.value.setHex(k.wc);fallU.flow.value=k.flow;skyU.top.value.setHex(k.s0);skyU.bot.value.setHex(k.s1);scene.fog.color.setHex(k.s1);
 const dv=holds.reduce((s,o)=>s+(+o.userData.wg_val)*(o.userData.day||0)/100,0),tot=holds.reduce((s,o)=>s+(+o.userData.wg_val),0),p=tot?dv/tot*100:0;const el=document.getElementById('today');el.textContent=(p>=0?'+':'')+p.toFixed(2)+'%';el.className='v '+(p>=0?'up':'down');
 document.querySelectorAll('#market button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));buildList();}
const mkbar=document.getElementById('market');['rally','fair','flat','bear','crash'].forEach(m=>{const b=document.createElement('button');b.dataset.m=m;b.textContent=MK[m].label;b.onclick=()=>setMarket(m);mkbar.appendChild(b);});

// hover + focus + EDITOR
const ray=new T.Raycaster(),mv=new T.Vector2();let hoverObj=null;const card=document.getElementById('card');
let focusTarget=null;
const gplane=new T.Plane(new T.Vector3(0,1,0),0);
function pickHold(x,y){mv.x=x/innerWidth*2-1;mv.y=-(y/innerHeight)*2+1;ray.setFromCamera(mv,camera);const src=islandRoot||scene;const hit=ray.intersectObject(src,true);if(hit.length){let o=hit[0].object;while(o&&!o.userData.wg_name)o=o.parent;return o||null;}return null;}
const ROTOK={stock:1,bond:1,metal:1,energy:1};
function groundHit(x,y){mv.x=x/innerWidth*2-1;mv.y=-(y/innerHeight)*2+1;ray.setFromCamera(mv,camera);gplane.constant=-topY;const p=new T.Vector3();ray.ray.intersectPlane(gplane,p);return p;}
function focusOn(o){const p=new T.Vector3();new T.Box3().setFromObject(o).getCenter(p);focusTarget=p.clone();controls.autoRotate=false;}
function showCard(o,x,y){const f=o.userData.wg_fam||'alts',d=o.userData.day||0,yd=o.userData.yield||0;card.innerHTML='<div class="cn">'+o.userData.wg_name+'</div><div class="cf" style="color:'+(FAM[f]?FAM[f][1]:'#ccc')+'">'+(FAM[f]?FAM[f][0]:f)+'</div><div class="cg"><div><div class="l">Value</div><div class="cv">'+fmt(+o.userData.wg_val)+'</div></div><div><div class="l">Today</div><div class="cv '+(d>=0?'up':'down')+'">'+(d>=0?'▲ +':'▼ ')+d.toFixed(2)+'%</div></div>'+(yd>0?'<div><div class="l">Yield</div><div class="cv">'+yd+'%</div></div>':'')+'</div>';card.style.left=Math.min(x+14,innerWidth-172)+'px';card.style.top=Math.max(8,y-8)+'px';card.classList.add('show');}
function hideCard(){card.classList.remove('show');}
// editor state
let editMode=false,drawMode=false;const sel=new Set(),boxes=new Map();let dragging=false,dragAnchor=null,moved=false;
let zonePts=[],zoneLine=null,zoneMarks=[];
function addBox(o){const b=new T.BoxHelper(o,0xffd86b);scene.add(b);boxes.set(o,b);}
function rmBox(o){const b=boxes.get(o);if(b){scene.remove(b);boxes.delete(o);}}
function clearSel(){[...sel].forEach(o=>rmBox(o));sel.clear();}
function selectOnly(o){clearSel();sel.add(o);addBox(o);focusOn(o);}
function toggleSel(o,add){if(!add)clearSel();if(sel.has(o)){sel.delete(o);rmBox(o);}else{sel.add(o);addBox(o);}}
function clearZone(){zonePts=[];if(zoneLine){scene.remove(zoneLine);zoneLine=null;}zoneMarks.forEach(m=>scene.remove(m));zoneMarks=[];}
function addZonePt(p){zonePts.push(p.clone());const s=new T.Mesh(new T.SphereGeometry(.5,10,10),new T.MeshBasicMaterial({color:0xffd86b}));s.position.copy(p);s.position.y=topY+.4;scene.add(s);zoneMarks.push(s);
 if(zoneLine)scene.remove(zoneLine);if(zonePts.length>=2){const pts=zonePts.map(q=>new T.Vector3(q.x,topY+.4,q.z));pts.push(pts[0].clone());zoneLine=new T.Line(new T.BufferGeometry().setFromPoints(pts),new T.LineBasicMaterial({color:0xffd86b}));scene.add(zoneLine);}}
function pip(x,z,pts){let c=false;for(let i=0,j=pts.length-1;i<pts.length;j=i++){const xi=pts[i].x,zi=pts[i].z,xj=pts[j].x,zj=pts[j].z;if(((zi>z)!=(zj>z))&&(x<(xj-xi)*(z-zi)/(zj-zi)+xi))c=!c;}return c;}
function fillZone(){if(zonePts.length<3||sel.size===0){setHint('Draw a zone (3+ points) and select holdings first');return;}
 const xs=zonePts.map(p=>p.x),zs=zonePts.map(p=>p.z);const minx=Math.min(...xs),maxx=Math.max(...xs),minz=Math.min(...zs),maxz=Math.max(...zs);
 const items=[...sel];const placed=[];const mind=3.2;let idx=0;
 for(const o of items){let done=false;for(let tr=0;tr<400&&!done;tr++){const x=minx+Math.random()*(maxx-minx),z=minz+Math.random()*(maxz-minz);if(!pip(x,z,zonePts))continue;if(placed.some(q=>(q.x-x)**2+(q.z-z)**2<mind*mind))continue;o.position.x=x;o.position.z=z;if(ROTOK[o.userData.wg_fam])o.rotation.y=Math.random()*6.28;placed.push({x,z});done=true;}}
 saveLayout();buildList();setHint('Filled zone with '+items.length+' holdings');clearZone();}
function saveLayout(){const o={};holds.forEach(h=>o[h.userData.wg_name]=[+h.position.x.toFixed(2),+h.position.y.toFixed(2),+h.position.z.toFixed(2),+h.rotation.y.toFixed(3)]);try{localStorage.setItem('wg_layout2',JSON.stringify(o));}catch(e){}return o;}
function setHint(t){document.getElementById('hint').innerHTML=t;}
// pointer handling
let downXY=null;
canvas.addEventListener('pointerdown',e=>{downXY=[e.clientX,e.clientY];
 if(editMode&&drawMode){addZonePt(groundHit(e.clientX,e.clientY));return;}
 if(editMode){const o=pickHold(e.clientX,e.clientY);if(o){if(!sel.has(o))toggleSel(o,e.shiftKey);dragging=true;moved=false;controls.enabled=false;dragAnchor=groundHit(e.clientX,e.clientY);}}
});
addEventListener('pointermove',e=>{
 if(dragging){const p=groundHit(e.clientX,e.clientY);const dx=p.x-dragAnchor.x,dz=p.z-dragAnchor.z;if(Math.abs(dx)+Math.abs(dz)>0.02)moved=true;sel.forEach(o=>{o.position.x+=dx;o.position.z+=dz;});dragAnchor=p;return;}
 if(!editMode){const o=pickHold(e.clientX,e.clientY);if(o){hoverObj=o;showCard(o,e.clientX,e.clientY);}else if(hoverObj){hoverObj=null;hideCard();}}
});
addEventListener('pointerup',e=>{if(dragging){dragging=false;controls.enabled=true;if(moved)saveLayout();return;}
 if(editMode&&!drawMode&&downXY&&Math.hypot(e.clientX-downXY[0],e.clientY-downXY[1])<5){const o=pickHold(e.clientX,e.clientY);if(!o&&!e.shiftKey)clearSel();}
 if(!editMode&&downXY&&Math.hypot(e.clientX-downXY[0],e.clientY-downXY[1])<5){const o=pickHold(e.clientX,e.clientY);if(o)focusOn(o);else{focusTarget=null;controls.autoRotate=!REDUCED;}}});
// toolbar
const tE=document.getElementById('tEdit');
function showEditTools(v){['tZone','tFill','tClear','tSave','tExport','tReset'].forEach(id=>document.getElementById(id).style.display=v?'':'none');}
tE.onclick=()=>{editMode=!editMode;tE.classList.toggle('on',editMode);showEditTools(editMode);controls.autoRotate=editMode?false:!REDUCED;hideCard();if(!editMode){clearSel();clearZone();drawMode=false;document.getElementById('tZone').classList.remove('on');setHint('<b>Drag</b> orbit · <b>click</b> a holding to focus');}else setHint('<b>Click</b> or a <b>list row</b> to select (shift=add) · <b>drag</b> or <b>arrow keys</b> to move · <b>[ ]</b> rotate · <b>Draw zone</b> → <b>Fill</b>');};
document.getElementById('tZone').onclick=(ev)=>{drawMode=!drawMode;ev.target.classList.toggle('on',drawMode);if(drawMode){clearZone();setHint('Click points on the ground to outline a zone, then Fill');}};
document.getElementById('tFill').onclick=fillZone;
document.getElementById('tClear').onclick=()=>{clearZone();setHint('Zone cleared');};
document.getElementById('tSave').onclick=()=>{saveLayout();setHint('Layout saved in this browser');};
document.getElementById('tReset').onclick=()=>{try{localStorage.removeItem('wg_layout2');localStorage.removeItem('wg_layout');}catch(e){}location.reload();};
addEventListener('keydown',e=>{if(!editMode||!sel.size)return;if(/^(input|textarea)$/i.test((e.target.tagName||'')))return;const s=e.shiftKey?2:0.5;let dx=0,dz=0,dr=0;switch(e.key){case'ArrowLeft':dx=-s;break;case'ArrowRight':dx=s;break;case'ArrowUp':dz=-s;break;case'ArrowDown':dz=s;break;case'[':dr=-0.13;break;case']':dr=0.13;break;case'{':dr=-0.03;break;case'}':dr=0.03;break;default:return;}e.preventDefault();sel.forEach(o=>{o.position.x+=dx;o.position.z+=dz;o.rotation.y+=dr;});saveLayout();});
document.getElementById('tExport').onclick=()=>{const o=saveLayout();const txt=JSON.stringify(o);const ta=document.getElementById('expT');ta.value=txt;document.getElementById('exp').classList.add('show');try{navigator.clipboard.writeText(txt);}catch(e){}};
document.getElementById('expClose').onclick=()=>document.getElementById('exp').classList.remove('show');

const composer=new T.EffectComposer(renderer);composer.addPass(new T.RenderPass(scene,camera));let bloom=null;if(!MOBILE){bloom=new T.UnrealBloomPass(new T.Vector2(innerWidth,innerHeight),0.16,0.5,1.0);composer.addPass(bloom);}composer.addPass(new T.ShaderPass(T.GammaCorrectionShader));const fxaa=new T.ShaderPass(T.FXAAShader);composer.addPass(fxaa);
function setSizes(){const w=innerWidth,h=innerHeight,pr=renderer.getPixelRatio();renderer.setSize(w,h);composer.setSize(w,h);if(bloom)bloom.setSize(w,h);if(fxaa.material)fxaa.material.uniforms.resolution.value.set(1/(w*pr),1/(h*pr));camera.aspect=w/h;camera.updateProjectionMatrix();}
addEventListener('resize',setSizes);setSizes();
const clock=new T.Clock();let lastAz=0,windSpin=0,dripT=0;
function anim(){requestAnimationFrame(anim);const dt=Math.min(.05,clock.getDelta()),t=clock.elapsedTime;
 if(focusTarget)controls.target.lerp(focusTarget,Math.min(1,dt*3));controls.update();
 const az=controls.getAzimuthalAngle();let daz=az-lastAz;if(daz>Math.PI)daz-=6.283;if(daz<-Math.PI)daz+=6.283;lastAz=az;windSpin+=((-daz*7)-windSpin)*Math.min(1,dt*6);
 waterU.t.value=t;fallU.t.value=t;
 if(!REDUCED){const gust=Math.sin(t*.5)*.5+.5;
  for(const s of sways){s.o.rotation.z=s.base+Math.sin(t*(0.5+s.beta*0.7)+s.ph)*s.amp*(.6+gust)+windSpin*s.flex*0.12;}
  for(const c of coins)c.o.rotation.y+=(0.4+c.beta*1.1)*dt;
  if(islandRoot&&!editMode)islandRoot.position.y=Math.sin(t*.5)*.5;
  clouds.forEach(c=>{c.position.x+=c.userData.sp*dt*(.5+waterU.flow.value*.4);if(c.position.x>140)c.position.x=-140;});
  birds.forEach(b=>{const u=b.userData;u.a+=u.sp*dt;b.position.set(Math.cos(u.a)*u.r,u.h+Math.sin(t*2+u.ph)*1.5,Math.sin(u.a)*u.r);b.rotation.y=-u.a+Math.PI/2;b.rotation.z=Math.sin(t*10+u.ph)*.3;});
  dripT+=dt;if(dripT>.12){dripT=0;emitDrip();}const arr=drips.geometry.attributes.position.array;for(let i=0;i<DN;i++){const s=dstate[i];if(s.life>0){s.vy-=dt*9;s.y+=s.vy*dt;s.life-=dt;arr[i*3]=s.x;arr[i*3+1]=s.y;arr[i*3+2]=s.z;if(s.life<=0||s.y<-24)arr[i*3+1]=-999;}else arr[i*3+1]=-999;}drips.geometry.attributes.position.needsUpdate=true;}
 if(editMode)boxes.forEach(b=>b.update());
 if(hoverObj&&!editMode){const p=new T.Vector3();hoverObj.getWorldPosition(p);p.project(camera);showCard(hoverObj,(p.x*.5+.5)*innerWidth,(-p.y*.5+.5)*innerHeight);}
 composer.render();
}
anim();
</script>

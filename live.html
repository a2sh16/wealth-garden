<title>The Wealth Isle · Live</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--ink:#eef1e8;--dim:#9aa593;--gold:#d8b566;--panel:rgba(12,18,14,.72);--line:rgba(255,255,255,.10);--up:#2a78d6;--down:#eda100}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#0b1017;color:var(--ink);font-family:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
#c{position:fixed;inset:0;display:block;touch-action:none}
#load{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:#0d1219;color:var(--dim);font-size:13px;letter-spacing:.08em}#load.hide{opacity:0;pointer-events:none;transition:opacity .6s}
.brand{position:fixed;top:16px;left:20px;z-index:6;pointer-events:none}
.brand .k{font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold);font-weight:600}
.brand h1{margin:5px 0 0;font-family:Georgia,serif;font-weight:600;font-size:clamp(19px,2.8vw,28px)}
.brand .nw{margin-top:7px;display:flex;gap:16px}.brand .nw .l{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}.brand .nw .v{font-family:ui-monospace,monospace;font-weight:600;font-size:16px}
.up{color:var(--up)}.down{color:var(--down)}
.market{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:6;display:flex;gap:5px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px;backdrop-filter:blur(8px)}
.market button{font:inherit;font-size:11.5px;font-weight:600;border:0;background:transparent;color:var(--dim);padding:6px 12px;border-radius:999px;cursor:pointer}
.market button.on{background:var(--ink);color:var(--gold)}
.list{position:fixed;top:64px;right:14px;width:236px;max-height:80vh;overflow:auto;z-index:6;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:9px;backdrop-filter:blur(10px)}
.list h2{font-family:Georgia,serif;font-size:13px;margin:3px 6px 6px}
.gh{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);display:flex;gap:6px;align-items:center;padding:6px 5px 2px}.gh .sw{width:8px;height:8px;border-radius:2px}.gh b{margin-left:auto;color:var(--ink);font-family:ui-monospace,monospace}
.row{display:flex;justify-content:space-between;gap:8px;padding:3px 5px;border-radius:6px;font-size:11.5px;cursor:pointer}.row:hover,.row.on{background:rgba(255,255,255,.08)}.row .v{font-family:ui-monospace,monospace;color:var(--dim)}.row .d{font-size:9px;display:block}
#card{position:fixed;z-index:7;pointer-events:none;opacity:0;transition:.1s;background:var(--panel);border:1px solid var(--gold);border-radius:10px;padding:8px 11px;backdrop-filter:blur(10px);min-width:150px}#card.show{opacity:1}
#card .cn{font-family:Georgia,serif;font-weight:600;font-size:14px}#card .cf{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;margin-top:1px}#card .cg{display:flex;gap:14px;margin-top:5px}#card .cg .l{font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}#card .cg .cv{font-family:ui-monospace,monospace;font-weight:600;font-size:13px}
.hint{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:6;color:var(--dim);font-size:12px;background:var(--panel);border:1px solid var(--line);padding:7px 13px;border-radius:999px;backdrop-filter:blur(8px)}.hint b{color:var(--ink)}
@media(max-width:720px){.list{display:none}.market button{padding:6px 9px;font-size:11px}}
</style>
<canvas id="c"></canvas>
<div id="load">shaping the isle…</div>
<div class="brand"><div class="k">AlphaPipeline · Wealth Garden</div><h1>The Wealth Isle</h1>
 <div class="nw"><div><div class="l">Net worth</div><div class="v" id="nw">—</div></div><div><div class="l">Today</div><div class="v" id="today">—</div></div><div><div class="l">Holdings</div><div class="v" id="hc">—</div></div></div></div>
<div class="market" id="market"></div>
<aside class="list"><h2>Holdings</h2><div id="lb"></div></aside>
<div id="card"></div>
<div class="hint"><b>Drag</b> orbit · <b>scroll</b> zoom · <b>click</b> a holding to focus</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/GammaCorrectionShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/FXAAShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/environments/RoomEnvironment.js"></script>
<script>
const T=THREE;
const MOBILE=innerWidth<720||('ontouchstart'in window&&innerWidth<900);
const FAM={stock:['Stocks','#3a9a3a'],bond:['Bonds','#1baf7a'],metal:['Metals','#eda100'],energy:['Energy','#eb6834'],crypto:['Crypto','#f0902a'],realestate:['Real estate','#8a63c9'],cash:['Cash','#2a78d6'],collectable:['Collectables','#e87ba4'],alts:['Alternatives','#e87ba4']};
const BETA={stock:1.1,bond:0.3,metal:0.7,energy:1.4,crypto:2.0,cash:0.04,realestate:0.9,collectable:0.4,alts:1.1};
const YIELDF={bond:[2,5],cash:[3,5],stock:[0,4],realestate:[4,6],energy:[0,2],metal:[0,0],crypto:[0,0],collectable:[0,0],alts:[0,5]};
const MK={rally:{b:2.6,sky0:0x4a90d6,sky1:0xeaf6ff,flow:2.4,wc:0x39a0e0,wl:0,fog:0x0,label:'Rally'},
 fair:{b:0.6,sky0:0x3f7fc4,sky1:0xeaf3fb,flow:1.3,wc:0x2f8fd4,wl:0,label:'Fair'},
 flat:{b:0.0,sky0:0x8fa7b8,sky1:0xe7ecee,flow:0.7,wc:0x5f96b0,wl:-.1,label:'Flat'},
 bear:{b:-1.7,sky0:0x9a8f7a,sky1:0xe8ddcb,flow:0.25,wc:0x9c7f4a,wl:-.5,label:'Drought'},
 crash:{b:-3.6,sky0:0x515a63,sky1:0xa7b0b6,flow:0.9,wc:0x486074,wl:.5,label:'Flood'}};
const fmt=v=>v>=1000?'$'+(v/1000).toFixed(v%1000&&v<10000?1:0)+'k':'$'+Math.round(v);
const REDUCED=matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const UP=new T.Color(0x2a78d6),DOWN=new T.Color(0xeda100),AMBER=new T.Color(0xc9a94b);
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return ((h>>>0)%1000)/1000;}
const DOMN={'Apple':'apple.com','NVIDIA':'nvidia.com','Coca-Cola':'coca-cola.com','JPMorgan':'jpmorganchase.com','Verizon':'verizon.com','AT&T':'att.com','Pfizer':'pfizer.com','3M':'3m.com','Disney':'disney.com','Nike':'nike.com','Starbucks':'starbucks.com','PayPal':'paypal.com','Ford':'ford.com','Intel':'intel.com','General Electric':'ge.com','Boeing':'boeing.com'};
const texLoader=new T.TextureLoader();texLoader.crossOrigin='anonymous';
const fruitMat=new T.MeshStandardMaterial({color:0xE0483A,roughness:.5,emissive:0x330a06,emissiveIntensity:.25});
function addFruit(o,dom){const box=new T.Box3().setFromObject(o);const c=box.getCenter(new T.Vector3());const sz=box.getSize(new T.Vector3());const invS=1/(o.scale.x||1);const N=4;const fr=[];
 for(let i=0;i<N;i++){const a=Math.random()*6.28,rr=sz.x*0.26*Math.sqrt(Math.random());const wp=new T.Vector3(c.x+Math.cos(a)*rr,box.min.y+sz.y*(0.58+Math.random()*0.28),c.z+Math.sin(a)*rr);const m=new T.Mesh(new T.SphereGeometry(0.5,12,12),fruitMat);m.position.copy(o.worldToLocal(wp.clone()));m.scale.setScalar(invS);o.add(m);fr.push(m);}
 if(dom)texLoader.load('https://logo.clearbit.com/'+dom+'?size=128',tex=>{try{tex.encoding=T.sRGBEncoding;fr.forEach(f=>{const sp=new T.Sprite(new T.SpriteMaterial({map:tex,transparent:true,depthWrite:false}));sp.position.copy(f.position);sp.scale.setScalar(1.15*invS);o.add(sp);f.visible=false;});}catch(e){}},undefined,()=>{});}

const canvas=document.getElementById('c');
const renderer=new T.WebGLRenderer({canvas,antialias:!MOBILE});renderer.setPixelRatio(Math.min(MOBILE?1.5:2,devicePixelRatio||1));
renderer.outputEncoding=T.LinearEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
const scene=new T.Scene();scene.fog=new T.FogExp2(0xd6e6f2,0.0012);
try{const pmrem=new T.PMREMGenerator(renderer);scene.environment=pmrem.fromScene(new T.RoomEnvironment(),0.04).texture;}catch(e){}
const camera=new T.PerspectiveCamera(46,innerWidth/innerHeight,0.1,2000);camera.position.set(46,26,46);
const controls=new T.OrbitControls(camera,canvas);controls.enableDamping=true;controls.dampingFactor=0.06;controls.autoRotate=!REDUCED;controls.autoRotateSpeed=0.5;controls.minDistance=12;controls.maxDistance=130;controls.maxPolarAngle=Math.PI*0.52;controls.target.set(0,2,0);
const skyU={top:{value:new T.Color(0x3f7fc4)},bot:{value:new T.Color(0xeaf3fb)}};
const sky=new T.Mesh(new T.SphereGeometry(900,32,16),new T.ShaderMaterial({side:T.BackSide,uniforms:skyU,vertexShader:'varying vec3 p;void main(){p=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',fragmentShader:'varying vec3 p;uniform vec3 top;uniform vec3 bot;void main(){float h=normalize(p).y*.5+.5;gl_FragColor=vec4(mix(bot,top,clamp(h,0.,1.)),1.);}'}));scene.add(sky);
const hemi=new T.HemisphereLight(0xbfd8ff,0x55704a,0.7);scene.add(hemi);
const sun=new T.DirectionalLight(0xfff2d6,2.7);sun.position.set(-30,44,20);sun.castShadow=true;sun.shadow.mapSize.set(MOBILE?1024:2048,MOBILE?1024:2048);sun.shadow.camera.near=1;sun.shadow.camera.far=200;sun.shadow.camera.left=-60;sun.shadow.camera.right=60;sun.shadow.camera.top=60;sun.shadow.camera.bottom=-60;sun.shadow.bias=-0.0004;scene.add(sun);
// clouds + birds
const cloudMat=new T.MeshStandardMaterial({color:0xffffff,roughness:1,transparent:true,opacity:.92});
const clouds=[];for(let i=0;i<(MOBILE?40:70);i++){const g=new T.Group();const n=2+((Math.random()*3)|0);for(let j=0;j<n;j++){const b=new T.Mesh(new T.SphereGeometry(3+Math.random()*3,8,6),cloudMat);b.position.set((Math.random()-.5)*10,(Math.random()-.5)*2,(Math.random()-.5)*6);b.scale.y=.6;g.add(b);}const a=Math.random()*6.28,r=26+Math.random()*90;g.position.set(Math.cos(a)*r,-24-Math.random()*8,Math.sin(a)*r);g.userData.sp=.3+Math.random()*.6;clouds.push(g);scene.add(g);}
const birds=[];const birdMat=new T.LineBasicMaterial({color:0x223038});for(let i=0;i<7;i++){const geo=new T.BufferGeometry().setFromPoints([new T.Vector3(-1,0,0),new T.Vector3(0,.4,0),new T.Vector3(1,0,0)]);const ln=new T.Line(geo,birdMat);ln.userData={a:Math.random()*6.28,r:30+Math.random()*40,h:18+Math.random()*16,sp:.15+Math.random()*.2,ph:Math.random()*6};ln.scale.setScalar(1.6+Math.random());birds.push(ln);scene.add(ln);}
// stylized water shader (world-pos waves, UV-independent)
const waterU={t:{value:0},flow:{value:1.3},cA:{value:new T.Color(0x2f8fd4)},cB:{value:new T.Color(0x9fe0f0)}};
function makeWater(){return new T.ShaderMaterial({transparent:true,uniforms:waterU,
 vertexShader:'varying vec3 wp;void main(){wp=(modelMatrix*vec4(position,1.)).xyz;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
 fragmentShader:'uniform float t;uniform float flow;uniform vec3 cA;uniform vec3 cB;varying vec3 wp;void main(){float w=sin(wp.x*.7+t*flow)*0.5+sin(wp.z*.9-t*flow*1.3)*0.5;float f=smoothstep(-0.2,1.0,w);vec3 c=mix(cA,cB,f*0.7);float spark=smoothstep(0.85,1.0,sin(wp.x*3.+t*flow*3.)*sin(wp.z*3.1-t*flow*2.));c+=spark*0.5;gl_FragColor=vec4(c,0.9);}'});}
const fallU={t:{value:0},flow:{value:1.3}};
function makeFall(){return new T.ShaderMaterial({transparent:true,uniforms:fallU,
 vertexShader:'varying vec2 vu;void main(){vu=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
 fragmentShader:'uniform float t;uniform float flow;varying vec2 vu;void main(){float s=fract(vu.y*3.-t*flow*1.5);float foam=smoothstep(0.7,1.0,s)+0.4;vec3 c=mix(vec3(0.45,0.72,0.9),vec3(1.),foam*0.6);gl_FragColor=vec4(c,0.8);}'});}

const holds=[];const sways=[];const coins=[];const mines=[];const waters=[];let islandRoot=null;
const loader=new T.GLTFLoader();
loader.load('island.glb',(gltf)=>{
  islandRoot=gltf.scene;scene.add(islandRoot);
  const box=new T.Box3().setFromObject(islandRoot);const ctr=box.getCenter(new T.Vector3());const size=box.getSize(new T.Vector3());
  controls.target.set(ctr.x,ctr.y+size.y*0.14,ctr.z);homeTarget.copy(controls.target);homeDist=camera.position.distanceTo(controls.target);
  islandRoot.traverse(o=>{
    if(o.isMesh){o.castShadow=true;o.receiveShadow=true;if(o.material)o.material.side=T.FrontSide;}
    const nm=o.name||'';
    if(/water/i.test(nm)&&o.isMesh){o.material=makeWater();waters.push(o);return;}
    if(o.isMesh&&o.material&&/Falls/i.test(o.material.name||'')){o.material=makeFall();return;}
  });
  // holdings (tag carriers)
  islandRoot.traverse(o=>{if(o.userData&&o.userData.wg_name){holds.push(o);}});
  holds.forEach(o=>{
    const fam=o.userData.wg_fam||'alts';o.userData.beta=BETA[fam]||1;
    const yr=YIELDF[fam]||[0,0];o.userData.yield=+(yr[0]+hash(o.userData.wg_name)* (yr[1]-yr[0])).toFixed(1);
    o.userData.seed=hash(o.userData.wg_name+'x');
    o.userData._mats=[];o.userData._orig=[];o.userData._fol=[];
    o.traverse(k=>{if(k.isMesh&&k.material&&k.material.color){k.material=k.material.clone();o.userData._mats.push(k.material);
      const c=k.material.color;o.userData._orig.push(c.clone());if(c.g>c.r*1.03&&c.g>c.b*1.03)o.userData._fol.push({m:k.material,o:c.clone()});}});
    const nm=o.name||'';const isTree=/Tree/i.test(nm)||fam==='stock';const isBush=/Bush/i.test(nm)||fam==='bond';
    const isCoin=/Coin/i.test(nm)||fam==='crypto'||(fam==='cash');const isBuild=/building|skyscraper|Windmill|fountain/i.test(nm)||fam==='realestate';
    const isMine=/Resource_Rock/i.test(nm)||fam==='metal';
    if(isTree||isBush)sways.push({o,base:o.rotation.z,amp:(isBush?0.03:0.06),ph:Math.random()*6.28,flex:isBush?0.5:1,beta:o.userData.beta});
    else if(isBuild)sways.push({o,base:o.rotation.z,amp:0.01,ph:Math.random()*6,flex:0.4,beta:0.5});
    if(isCoin)coins.push({o,beta:o.userData.beta});
    if(isMine)mines.push(o);
    if(fam==='stock')addFruit(o,DOMN[o.userData.wg_name]);
  });
  buildList();setMarket('fair');
  const ld=document.getElementById('load');ld.classList.add('hide');setTimeout(()=>ld.style.display='none',700);
},undefined,(err)=>{document.getElementById('load').textContent='Could not load the isle.';console.error(err);});

// drips
const DN=90;const dpos=new Float32Array(DN*3);const dstate=[];for(let i=0;i<DN;i++){dpos[i*3+1]=-999;dstate.push({life:0});}
const dg=new T.BufferGeometry();dg.setAttribute('position',new T.Float32BufferAttribute(dpos,3));
const drips=new T.Points(dg,new T.PointsMaterial({color:0xf3c65a,size:.5,transparent:true,opacity:.9,depthWrite:false}));scene.add(drips);let dcur=0;
function emitDrip(){if(!mines.length)return;const m=mines[(Math.random()*mines.length)|0];const p=new T.Vector3();m.getWorldPosition(p);const b=new T.Box3().setFromObject(m);const i=dcur++%DN;dstate[i]={life:1.4,vy:0,x:p.x+(Math.random()-.5)*1.2,y:b.max.y,z:p.z+(Math.random()-.5)*1.2};}

// market
let curM='fair';
function computeDays(m){const k=MK[m];holds.forEach(o=>{const j=(o.userData.seed-0.5)*1.6;let d=k.b*o.userData.beta+j;const f=o.userData.wg_fam;if(f==='cash')d=k.b*0.03+(o.userData.seed-0.5)*0.2;if(f==='bond')d=k.b*0.3+(o.userData.seed-0.5)*0.5-(m==='rally'?0.3:0);o.userData.day=d;});}
function tint(o){const d=o.userData.day||0;const sign=d>=0?1:-1;const mag=Math.min(1,Math.abs(d)/4);const col=d>=0?UP:DOWN;
  o.userData._mats.forEach(mm=>{if(mm.emissive){mm.emissive.copy(col);mm.emissiveIntensity=0.04+mag*0.33;}});
  o.userData._fol.forEach(f=>{f.m.color.copy(f.o).lerp(AMBER,d<0?mag*0.6:0);});}
function setMarket(m){curM=m;const k=MK[m];computeDays(m);holds.forEach(tint);
  waterU.flow.value=k.flow;waterU.cA.value.setHex(k.wc);fallU.flow.value=k.flow;
  skyU.top.value.setHex(k.sky0);skyU.bot.value.setHex(k.sky1);scene.fog.color.setHex(k.sky1);
  waters.forEach(w=>{w.position.y=(w.userData.baseY!==undefined?w.userData.baseY:(w.userData.baseY=w.position.y))+k.wl;});
  const dayVal=holds.reduce((s,o)=>s+(+o.userData.wg_val)*(o.userData.day||0)/100,0);const tot=holds.reduce((s,o)=>s+(+o.userData.wg_val),0);const pct=tot?dayVal/tot*100:0;
  const el=document.getElementById('today');el.textContent=(pct>=0?'+':'')+pct.toFixed(2)+'%';el.className='v '+(pct>=0?'up':'down');
  document.querySelectorAll('#market button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
  buildList();
}
const mkbar=document.getElementById('market');['rally','fair','flat','bear','crash'].forEach(m=>{const b=document.createElement('button');b.dataset.m=m;b.textContent=MK[m].label;b.onclick=()=>setMarket(m);mkbar.appendChild(b);});

// list
const lb=document.getElementById('lb');
function buildList(){lb.innerHTML='';const byF={};let nw=0;holds.forEach(o=>{const f=o.userData.wg_fam||'alts';(byF[f]=byF[f]||[]).push(o);nw+=(+o.userData.wg_val||0);});
 document.getElementById('nw').textContent=fmt(nw);document.getElementById('hc').textContent=holds.length;
 Object.keys(FAM).forEach(f=>{const its=(byF[f]||[]).sort((a,b)=>(+b.userData.wg_val)-(+a.userData.wg_val));if(!its.length)return;const sum=its.reduce((s,o)=>s+(+o.userData.wg_val||0),0);
  const g=document.createElement('div');g.innerHTML='<div class="gh"><span class="sw" style="background:'+FAM[f][1]+'"></span>'+FAM[f][0]+'<b>'+fmt(sum)+'</b></div>';
  its.forEach(o=>{const d=o.userData.day||0;const r=document.createElement('div');r.className='row';
   r.innerHTML='<span>'+o.userData.wg_name+'</span><span class="v">'+fmt(+o.userData.wg_val)+'<span class="d '+(d>=0?'up':'down')+'">'+(d>=0?'+':'')+d.toFixed(1)+'%</span></span>';
   r.onmouseenter=()=>{hoverObj=o;showCardObj(o);};r.onmouseleave=()=>{hoverObj=null;hideCard();};r.onclick=()=>focusOn(o);g.appendChild(r);});
  lb.appendChild(g);});}

// hover + click focus
const ray=new T.Raycaster();const mv=new T.Vector2();let hoverObj=null;const card=document.getElementById('card');
let focusTarget=null;const homeTarget=new T.Vector3();let homeDist=60;let curFocusPos=null;
function pickAt(x,y){mv.x=x/innerWidth*2-1;mv.y=-(y/innerHeight)*2+1;ray.setFromCamera(mv,camera);const hit=ray.intersectObjects(holds,true);if(hit.length){let o=hit[0].object;while(o&&!o.userData.wg_name)o=o.parent;return o||null;}return null;}
canvas.addEventListener('pointermove',e=>{const o=pickAt(e.clientX,e.clientY);if(o){hoverObj=o;showCard(o,e.clientX,e.clientY);}else if(hoverObj&&!lastList){hideCard();hoverObj=null;}lastCX=e.clientX;lastCY=e.clientY;});
let lastList=false,lastCX=0,lastCY=0;
canvas.addEventListener('click',e=>{const o=pickAt(e.clientX,e.clientY);if(o)focusOn(o);else{focusTarget=null;controls.autoRotate=!REDUCED;}});
function focusOn(o){const p=new T.Vector3();new T.Box3().setFromObject(o).getCenter(p);focusTarget=p.clone();controls.autoRotate=false;}
function showCardObj(o){const p=new T.Vector3();o.getWorldPosition(p);p.project(camera);const x=(p.x*.5+.5)*innerWidth,y=(-p.y*.5+.5)*innerHeight;showCard(o,x,y);}
function showCard(o,x,y){const f=o.userData.wg_fam||'alts';const d=o.userData.day||0;const yd=o.userData.yield||0;
 card.innerHTML='<div class="cn">'+o.userData.wg_name+'</div><div class="cf" style="color:'+(FAM[f]?FAM[f][1]:'#ccc')+'">'+(FAM[f]?FAM[f][0]:f)+'</div>'+
  '<div class="cg"><div><div class="l">Value</div><div class="cv">'+fmt(+o.userData.wg_val)+'</div></div>'+
  '<div><div class="l">Today</div><div class="cv '+(d>=0?'up':'down')+'">'+(d>=0?'▲ +':'▼ ')+d.toFixed(2)+'%</div></div>'+
  (yd>0?'<div><div class="l">Yield</div><div class="cv">'+yd+'%</div></div>':'')+'</div>';
 card.style.left=Math.min(x+14,innerWidth-172)+'px';card.style.top=Math.max(8,y-8)+'px';card.classList.add('show');}
function hideCard(){card.classList.remove('show');}

const composer=new T.EffectComposer(renderer);composer.addPass(new T.RenderPass(scene,camera));
let bloom=null;if(!MOBILE){bloom=new T.UnrealBloomPass(new T.Vector2(innerWidth,innerHeight),0.16,0.5,1.0);composer.addPass(bloom);}
composer.addPass(new T.ShaderPass(T.GammaCorrectionShader));
const fxaa=new T.ShaderPass(T.FXAAShader);composer.addPass(fxaa);
function setSizes(){const w=innerWidth,h=innerHeight,pr=renderer.getPixelRatio();renderer.setSize(w,h);composer.setSize(w,h);if(bloom)bloom.setSize(w,h);if(fxaa.material)fxaa.material.uniforms.resolution.value.set(1/(w*pr),1/(h*pr));camera.aspect=w/h;camera.updateProjectionMatrix();}
addEventListener('resize',setSizes);setSizes();

const clock=new T.Clock();let lastAz=0,windSpin=0,dripT=0;
function anim(){requestAnimationFrame(anim);const dt=Math.min(.05,clock.getDelta()),t=clock.elapsedTime;
 if(focusTarget){controls.target.lerp(focusTarget,Math.min(1,dt*3));}
 controls.update();
 const az=controls.getAzimuthalAngle();let daz=az-lastAz;if(daz>Math.PI)daz-=6.283;if(daz<-Math.PI)daz+=6.283;lastAz=az;
 windSpin+=((-daz*7)-windSpin)*Math.min(1,dt*6);
 waterU.t.value=t;fallU.t.value=t;
 if(!REDUCED){const gust=Math.sin(t*0.5)*0.5+0.5;
  for(const s of sways){const spd=0.5+s.beta*0.7;s.o.rotation.z=s.base+Math.sin(t*spd+s.ph)*s.amp*(0.6+gust)+windSpin*s.flex*0.12;}
  for(const c of coins){c.o.rotation.y+=(0.4+c.beta*1.1)*dt;}
  if(islandRoot)islandRoot.position.y=Math.sin(t*0.5)*0.5;
  clouds.forEach(c=>{c.position.x+=c.userData.sp*dt*(0.5+waterU.flow.value*0.4);if(c.position.x>120)c.position.x=-120;});
  birds.forEach(b=>{const u=b.userData;u.a+=u.sp*dt;b.position.set(Math.cos(u.a)*u.r,u.h+Math.sin(t*2+u.ph)*1.5,Math.sin(u.a)*u.r);b.rotation.y=-u.a+Math.PI/2;b.rotation.z=Math.sin(t*10+u.ph)*0.3;});
  dripT+=dt;if(dripT>0.12){dripT=0;emitDrip();}
  const arr=drips.geometry.attributes.position.array;for(let i=0;i<DN;i++){const s=dstate[i];if(s.life>0){s.vy-=dt*9;s.y+=s.vy*dt;s.life-=dt;arr[i*3]=s.x;arr[i*3+1]=s.y;arr[i*3+2]=s.z;if(s.life<=0||s.y<-20)arr[i*3+1]=-999;}else arr[i*3+1]=-999;}
  drips.geometry.attributes.position.needsUpdate=true;}
 if(hoverObj)showCardObj(hoverObj);
 composer.render();
}
anim();
</script>

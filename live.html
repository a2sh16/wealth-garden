<title>The Wealth Isle · Live</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--ink:#eef1e8;--dim:#9aa593;--gold:#d8b566;--panel:rgba(12,18,14,.72);--line:rgba(255,255,255,.10)}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#0b1017;color:var(--ink);font-family:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
#c{position:fixed;inset:0;display:block;touch-action:none}
#load{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:#0d1219;color:var(--dim);font-size:13px;letter-spacing:.08em}
#load.hide{opacity:0;pointer-events:none;transition:opacity .6s}
.brand{position:fixed;top:16px;left:20px;z-index:6;pointer-events:none}
.brand .k{font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold);font-weight:600}
.brand h1{margin:5px 0 0;font-family:Georgia,serif;font-weight:600;font-size:clamp(19px,2.8vw,28px)}
.brand .nw{margin-top:7px;display:flex;gap:16px}.brand .nw .l{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}.brand .nw .v{font-family:ui-monospace,monospace;font-weight:600;font-size:16px}
.list{position:fixed;top:14px;right:14px;width:236px;max-height:86vh;overflow:auto;z-index:6;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:9px;backdrop-filter:blur(10px)}
.list h2{font-family:Georgia,serif;font-size:13px;margin:3px 6px 6px}
.gh{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);display:flex;gap:6px;align-items:center;padding:6px 5px 2px}.gh .sw{width:8px;height:8px;border-radius:2px}.gh b{margin-left:auto;color:var(--ink);font-family:ui-monospace,monospace}
.row{display:flex;justify-content:space-between;gap:8px;padding:3px 5px;border-radius:6px;font-size:11.5px;cursor:pointer}.row:hover,.row.on{background:rgba(255,255,255,.07)}.row .v{font-family:ui-monospace,monospace;color:var(--dim)}
#card{position:fixed;z-index:7;pointer-events:none;opacity:0;transition:.1s;background:var(--panel);border:1px solid var(--gold);border-radius:10px;padding:8px 11px;backdrop-filter:blur(10px)}#card.show{opacity:1}
#card .cn{font-family:Georgia,serif;font-weight:600;font-size:14px}#card .cf{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;margin-top:1px}#card .cv{font-family:ui-monospace,monospace;font-weight:600;font-size:14px;margin-top:4px}
.hint{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:6;color:var(--dim);font-size:12px;background:var(--panel);border:1px solid var(--line);padding:7px 13px;border-radius:999px;backdrop-filter:blur(8px)}.hint b{color:var(--ink)}
@media(max-width:720px){.list{display:none}}
</style>
<canvas id="c"></canvas>
<div id="load">shaping the isle…</div>
<div class="brand"><div class="k">AlphaPipeline · Wealth Garden</div><h1>The Wealth Isle</h1>
 <div class="nw"><div><div class="l">Net worth</div><div class="v" id="nw">—</div></div><div><div class="l">Holdings</div><div class="v" id="hc">—</div></div></div></div>
<aside class="list"><h2>Holdings</h2><div id="lb"></div></aside>
<div id="card"></div>
<div class="hint"><b>Drag</b> to orbit · <b>scroll</b> to zoom · hover a holding</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
const T=THREE;
const FAM={stock:['Stocks','#3a9a3a'],bond:['Bonds','#1baf7a'],metal:['Metals','#eda100'],energy:['Energy','#eb6834'],crypto:['Crypto','#f0902a'],realestate:['Real estate','#8a63c9'],cash:['Cash','#2a78d6'],collectable:['Collectables','#e87ba4'],alts:['Alternatives','#e87ba4']};
const fmt=v=>v>=1000?'$'+(v/1000).toFixed(v%1000&&v<10000?1:0)+'k':'$'+v;
const REDUCED=matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const canvas=document.getElementById('c');
const renderer=new T.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(2,devicePixelRatio||1));renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
const scene=new T.Scene();scene.fog=new T.FogExp2(0xbcd6e8,0.0042);
const camera=new T.PerspectiveCamera(46,innerWidth/innerHeight,0.1,2000);
camera.position.set(46,26,46);
const controls=new T.OrbitControls(camera,canvas);controls.enableDamping=true;controls.dampingFactor=0.06;controls.autoRotate=!REDUCED;controls.autoRotateSpeed=0.5;controls.minDistance=14;controls.maxDistance=120;controls.maxPolarAngle=Math.PI*0.52;controls.target.set(0,2,0);
// sky dome
const sky=new T.Mesh(new T.SphereGeometry(900,32,16),new T.ShaderMaterial({side:T.BackSide,uniforms:{top:{value:new T.Color(0x3f7fc4)},bot:{value:new T.Color(0xeaf3fb)}},vertexShader:'varying vec3 p;void main(){p=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',fragmentShader:'varying vec3 p;uniform vec3 top;uniform vec3 bot;void main(){float h=normalize(p).y*.5+.5;gl_FragColor=vec4(mix(bot,top,clamp(h,0.,1.)),1.);}'}));scene.add(sky);
// lights
const hemi=new T.HemisphereLight(0xbfd8ff,0x55704a,0.85);scene.add(hemi);
const sun=new T.DirectionalLight(0xfff2d6,2.4);sun.position.set(-30,44,20);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.near=1;sun.shadow.camera.far=200;sun.shadow.camera.left=-60;sun.shadow.camera.right=60;sun.shadow.camera.top=60;sun.shadow.camera.bottom=-60;sun.shadow.bias=-0.0004;scene.add(sun);
// cloud sea
const cloudMat=new T.MeshStandardMaterial({color:0xffffff,roughness:1,transparent:true,opacity:.9});
const clouds=[];for(let i=0;i<70;i++){const g=new T.Group();const n=2+((Math.random()*3)|0);for(let j=0;j<n;j++){const b=new T.Mesh(new T.SphereGeometry(3+Math.random()*3,8,6),cloudMat);b.position.set((Math.random()-.5)*10,(Math.random()-.5)*2,(Math.random()-.5)*6);b.scale.y=.6;g.add(b);}const a=Math.random()*6.28,r=26+Math.random()*90;g.position.set(Math.cos(a)*r,-24-Math.random()*8,Math.sin(a)*r);g.userData.sp=.3+Math.random()*.6;clouds.push(g);scene.add(g);}
// birds
const birds=[];const birdMat=new T.LineBasicMaterial({color:0x223038});for(let i=0;i<7;i++){const geo=new T.BufferGeometry().setFromPoints([new T.Vector3(-1,0,0),new T.Vector3(0,.4,0),new T.Vector3(1,0,0)]);const ln=new T.Line(geo,birdMat);ln.userData={a:Math.random()*6.28,r:30+Math.random()*40,h:18+Math.random()*16,sp:.15+Math.random()*.2,ph:Math.random()*6};ln.scale.setScalar(1.6+Math.random());birds.push(ln);scene.add(ln);}

const holds=[];const sways=[];const coins=[];const mines=[];const waters=[];const buildings=[];let islandRoot=null;
const loader=new T.GLTFLoader();
loader.load('island.glb',(gltf)=>{
  islandRoot=gltf.scene;scene.add(islandRoot);
  const box=new T.Box3().setFromObject(islandRoot);const ctr=box.getCenter(new T.Vector3());const size=box.getSize(new T.Vector3());
  controls.target.set(ctr.x, ctr.y+size.y*0.15, ctr.z);
  islandRoot.traverse(o=>{
    if(o.isMesh){o.castShadow=true;o.receiveShadow=true;if(o.material){o.material.side=T.FrontSide;}}
    const ud=o.userData||{};const fam=ud.wg_fam; const nm=o.name||'';
    if(ud.wg_name){holds.push(o);}
    // classify for animation by family or name
    const isTree=/Tree/i.test(nm)||fam==='stock';
    const isBush=/Bush/i.test(nm)||fam==='bond';
    const isCoin=/Coin/i.test(nm)||fam==='crypto'||fam==='cash';
    const isBuild=/building|skyscraper|Windmill|fountain/i.test(nm)||fam==='realestate'||fam==='cash';
    const isMine=/Resource_Rock/i.test(nm)||fam==='metal';
    if(isTree||isBush){sways.push({o,base:o.rotation.z,amp:(isBush?0.02:0.05)+Math.random()*0.03,spd:0.6+Math.random()*0.7,ph:Math.random()*6.28,flex:isBush?0.5:1});}
    else if(isBuild&&!/fountain_water|fountain_leaves/.test(nm)){sways.push({o,base:o.rotation.z,amp:0.008+Math.random()*0.006,spd:0.5,ph:Math.random()*6,flex:0.4});}
    if(isCoin){coins.push({o,sp:(fam==='crypto'?2.2:0.6)+Math.random()*0.4});}
    if(isMine){mines.push(o);}
    if(/water/i.test(nm)){waters.push(o);}
  });
  buildList();
  document.getElementById('load').classList.add('hide');
},(xhr)=>{},(err)=>{document.getElementById('load').textContent='Could not load the isle.';console.error(err);});

// drips from mines
const dripGeo=new T.BufferGeometry();const DN=90;const dpos=new Float32Array(DN*3);const dstate=[];
for(let i=0;i<DN;i++){dpos[i*3+1]=-999;dstate.push({life:0});}
dripGeo.setAttribute('position',new T.Float32BufferAttribute(dpos,3));
const drips=new T.Points(dripGeo,new T.PointsMaterial({color:0xf3c65a,size:.5,transparent:true,opacity:.9,depthWrite:false}));scene.add(drips);
let dcur=0;
function emitDrip(){if(!mines.length)return;const m=mines[(Math.random()*mines.length)|0];const p=new T.Vector3();m.getWorldPosition(p);const b=new T.Box3().setFromObject(m);const i=dcur++%DN;dstate[i]={life:1.4,vx:(Math.random()-.5)*.02,vy:0,x:p.x+(Math.random()-.5)*1.2,y:b.max.y,z:p.z+(Math.random()-.5)*1.2};}

// holdings list
const lb=document.getElementById('lb');
function buildList(){
  const byF={};let nw=0;holds.forEach(o=>{const f=o.userData.wg_fam||'alts';(byF[f]=byF[f]||[]).push(o);nw+=(+o.userData.wg_val||0);});
  document.getElementById('nw').textContent=fmt(nw);document.getElementById('hc').textContent=holds.length;
  Object.keys(FAM).forEach(f=>{const its=(byF[f]||[]).sort((a,b)=>(+b.userData.wg_val)-(+a.userData.wg_val));if(!its.length)return;
   const sum=its.reduce((s,o)=>s+(+o.userData.wg_val||0),0);const g=document.createElement('div');
   g.innerHTML='<div class="gh"><span class="sw" style="background:'+FAM[f][1]+'"></span>'+FAM[f][0]+'<b>'+fmt(sum)+'</b></div>';
   its.forEach(o=>{const r=document.createElement('div');r.className='row';r.innerHTML='<span>'+o.userData.wg_name+'</span><span class="v">'+fmt(+o.userData.wg_val)+'</span>';
    r.onmouseenter=()=>{hoverObj=o;};r.onmouseleave=()=>{hoverObj=null;};g.appendChild(r);});
   lb.appendChild(g);});
}
// hover pick
const ray=new T.Raycaster();const m=new T.Vector2();let hoverObj=null;const card=document.getElementById('card');
canvas.addEventListener('pointermove',e=>{m.x=e.clientX/innerWidth*2-1;m.y=-(e.clientY/innerHeight)*2+1;
 if(!holds.length)return;ray.setFromCamera(m,camera);const hit=ray.intersectObjects(holds,true);
 if(hit.length){let o=hit[0].object;while(o&&!o.userData.wg_name)o=o.parent;if(o){hoverObj=o;showCard(o,e.clientX,e.clientY);return;}}
 if(!listHover())hideCard();});
function listHover(){return false;}
function showCard(o,x,y){const f=o.userData.wg_fam||'alts';card.innerHTML='<div class="cn">'+o.userData.wg_name+'</div><div class="cf" style="color:'+(FAM[f]?FAM[f][1]:'#ccc')+'">'+(FAM[f]?FAM[f][0]:f)+'</div><div class="cv">'+fmt(+o.userData.wg_val)+'</div>';card.style.left=Math.min(x+14,innerWidth-160)+'px';card.style.top=Math.max(8,y-8)+'px';card.classList.add('show');}
function hideCard(){card.classList.remove('show');}

addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
renderer.setSize(innerWidth,innerHeight);
const clock=new T.Clock();let lastAz=0,windSpin=0,dripT=0;
function anim(){requestAnimationFrame(anim);const dt=Math.min(.05,clock.getDelta()),t=clock.elapsedTime;
 controls.update();
 // spin inertia: change in azimuth -> wind on foliage
 const az=controls.getAzimuthalAngle();let daz=az-lastAz;if(daz>Math.PI)daz-=6.283;if(daz<-Math.PI)daz+=6.283;lastAz=az;
 windSpin+=( (-daz*7) - windSpin)*Math.min(1,dt*6);
 if(!REDUCED){
  const gust=Math.sin(t*0.5)*0.5+0.5;
  for(const s of sways){s.o.rotation.z=s.base+Math.sin(t*s.spd+s.ph)*s.amp*(0.6+gust)+windSpin*s.flex*0.12;}
  for(const c of coins){c.o.rotation.y+=c.sp*dt;}
  if(islandRoot)islandRoot.position.y=Math.sin(t*0.5)*0.5;
  for(const w of waters){if(w.material){w.material.emissiveIntensity=0.4+Math.sin(t*2.5)*0.2;}}
  clouds.forEach(c=>{c.position.x+=c.userData.sp*dt;if(c.position.x>120)c.position.x=-120;});
  birds.forEach(b=>{const u=b.userData;u.a+=u.sp*dt;b.position.set(Math.cos(u.a)*u.r,u.h+Math.sin(t*2+u.ph)*1.5,Math.sin(u.a)*u.r);b.rotation.y=-u.a+Math.PI/2;b.rotation.z=Math.sin(t*10+u.ph)*0.3;});
  // drips
  dripT+=dt;if(dripT>0.12){dripT=0;emitDrip();}
  const arr=drips.geometry.attributes.position.array;
  for(let i=0;i<DN;i++){const s=dstate[i];if(s.life>0){s.vy-=dt*9;s.y+=s.vy*dt;s.x+=s.vx;s.life-=dt;arr[i*3]=s.x;arr[i*3+1]=s.y;arr[i*3+2]=s.z;if(s.life<=0||s.y<-20)arr[i*3+1]=-999;}else arr[i*3+1]=-999;}
  drips.geometry.attributes.position.needsUpdate=true;
 }
 // sync list highlight
 document.querySelectorAll('.row').forEach(r=>{});
 renderer.render(scene,camera);
}
anim();
</script>
